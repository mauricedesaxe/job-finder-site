name: D1 provision

on:
  push:
    branches: [wire-intake-form]
    paths: ['.github/workflows/d1-provision.yml']
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Build site
        run: yarn build
      - name: Canary — deploy with a D1 binding using only the CI token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > canary.wrangler.jsonc <<'EOF'
          {
            "name": "jobfiend-d1-canary",
            "compatibility_date": "2024-09-06",
            "main": "./worker/index.ts",
            "workers_dev": true,
            "assets": { "directory": "./dist", "binding": "ASSETS" },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "jobfiend-signups",
                "database_id": "00000000-0000-0000-0000-000000000000"
              }
            ]
          }
          EOF
          npx wrangler deploy --config canary.wrangler.jsonc 2>&1 | tee canary.log
          npx wrangler delete --name jobfiend-d1-canary --force 2>&1 | tail -2 || true
