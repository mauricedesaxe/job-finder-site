name: D1 provision

on:
  push:
    branches: [wire-intake-form]
    paths: ['.github/workflows/d1-provision.yml']
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Create database (or find existing)
        id: db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 create jobfiend-signups > create.log 2>&1 || true
          if grep -qE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' create.log; then
            id=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' create.log | head -1)
            echo "created fresh"
          else
            echo "create failed or already exists; listing"
            cat create.log
            id=$(npx wrangler d1 list --json | python3 -c "import sys,json;print([d['uuid'] for d in json.load(sys.stdin) if d['name']=='jobfiend-signups'][0])")
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "database_id: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply jobfiend-signups --remote
      - name: Smoke query
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute jobfiend-signups --remote --command "SELECT count() FROM signups"
